
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>

    <h1>Snake</h1>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <button id="restartButton">Restart</button>
    <p id="info"></p>

    <script>
        // ===== GAME SETUP =====
        const canvas =
            document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        // ===== INITIAL STATE =====
        let snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];
        let direction = { x: 1, y: 0 };
        let food = { x: 15, y: 15 };
        let score = 0;
        let isPaused = false;

        // ===== DRAWING =====
        const drawGame = () => {
            ctx.clearRect(0, 0,
                canvas.width, canvas.height);

            ctx.fillStyle = "#ff2e93";
            ctx.fillRect(
                food.x * gridSize,
                food.y * gridSize,
                gridSize, gridSize
            );

            ctx.fillStyle = "#39ff14";
            for (const segment of snake) {
                ctx.fillRect(
                    segment.x * gridSize,
                    segment.y * gridSize,
                    gridSize, gridSize
                );
            }
        };

        drawGame();

        // ===================================
        // BUILD THE GAME FROM HERE
        // ===================================
        //
        // Use your custom agent in VS Code Chat
        // to guide your work through each step.
        // Commit regularly.
        //
        // Step 1: Movement (game loop)
        const moveSnake = () => {
            // Get the current head
            const head = snake[0];

            // Calculate the new head position
            const newHead = {
                x: head.x + direction.x,
                y: head.y + direction.y
            };
            // Check for collisions with walls or the snake itself
            const hitWall =
                newHead.x < 0 ||
                newHead.x >= tileCount ||
                newHead.y < 0 ||
                newHead.y >= tileCount;

            const hitSelf = snake.some(segment =>
                segment.x === newHead.x && segment.y === newHead.y
            );

            if (hitWall || hitSelf) {
                clearInterval(gameLoop);
                document.getElementById("info").textContent = "Game Over! Score: " + score;
                return;
            }

            // Add the new head to the beginning of the array
            snake.unshift(newHead);

            // Check if the snake eats the food
            if (newHead.x === food.x && newHead.y === food.y) {
                // Increase score
                score++;
                document.getElementById("info").textContent = "Score: " + score;

                // Generate a new food position that does not overlap the snake
                do {
                    food = {
                        x: Math.floor(Math.random() * tileCount),
                        y: Math.floor(Math.random() * tileCount)
                    };
                } while (
                    snake.some(segment =>
                        segment.x === food.x && segment.y === food.y
                    )
                );
            } else {
                snake.pop();
            }

            // Redraw the game
            drawGame();
        };

        let gameLoop = setInterval(moveSnake, 200);

        // Step 2: Keyboard controls
        document.addEventListener("keydown", (event) => {
            if (event.code === "Space") {
                event.preventDefault();

                if (isPaused) {
                    // Resume the game
                    isPaused = false;
                    gameLoop = setInterval(moveSnake, 200);
                } else {
                    // Pause the game
                    clearInterval(gameLoop);
                    isPaused = true;
                }

                return;
            }

            switch (event.key) {
                case "ArrowRight":
                    if (direction.x !== -1) {
                        direction = { x: 1, y: 0 };
                    }
                    break;

                case "ArrowLeft":
                    if (direction.x !== 1) {
                        direction = { x: -1, y: 0 };
                    }
                    break;

                case "ArrowDown":
                    if (direction.y !== -1) {
                        direction = { x: 0, y: 1 };
                    }
                    break;

                case "ArrowUp":
                    if (direction.y !== 1) {
                        direction = { x: 0, y: -1 };
                    }
                    break;
            }
        });
        // Restart button click event
        document.getElementById("restartButton").addEventListener("click", () => {
            // Stop the existing game loop
            clearInterval(gameLoop);

            // Reset snake to its starting position
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];

            // Reset direction
            direction = { x: 1, y: 0 };

            // Reset food position
            food = { x: 15, y: 15 };

            // Reset score
            score = 0;
            // Reset pause state
            isPaused = false;

            // Clear info message
            document.getElementById("info").textContent = "";

            // Redraw the game board
            drawGame();

            // Start a new game loop
            gameLoop = setInterval(moveSnake, 200);
        });

        // Step 3: Eating and growing
        // Step 4: Game over
        // Step 5: Improvements
        //
        // ===================================

    </script>

</body>
</html>
